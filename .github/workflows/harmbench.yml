name: "[DEPRECATED] HarmBench Benchmark"

# ══════════════════════════════════════════════════════════════════════════
# DEPRECATED (2026-07-06) — DO NOT RUN. Superseded by LexBench Production
# (.github/workflows/lexbench-prod.yml): full sharded suite, grounded
# harm-compliance judge, auto-publishes to benchmark_results, targets the
# canonical www host. Kept for historical reference; disabled below.
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      n:
        description: 'DEPRECATED — use "LexBench Production" instead.'
        default: '200'

jobs:
  deprecated-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation notice
        run: |
          echo "::error::This workflow is deprecated and disabled. Use 'LexBench Production' (lexbench-prod.yml) instead."
          exit 1

  benchmark:
    if: false  # disabled — see deprecation notice above
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run harness
        run: |
          mkdir -p data
          npm run harmbench -- \
            --prompts scripts/harmbench/test-prompts.jsonl \
            --endpoint "https://lexaureon.com" \
            --n 200 \
            --out data/results.jsonl
      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmbench-results-${{ github.run_id }}
          path: data/
          retention-days: 14
