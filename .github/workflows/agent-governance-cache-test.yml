name: Agent Governance Cache — Typecheck + Unit Test

on:
  push:
    branches:
      - 'research/agent-governance-cache-vnext'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Constitutional cache tests
        run: npx vitest run __tests__/constitutional-execution-cache.test.ts
