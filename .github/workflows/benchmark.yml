name: "[DEPRECATED] Benchmark Suite"

# ══════════════════════════════════════════════════════════════════════════
# DEPRECATED (2026-07-06) — DO NOT RUN. This was the v3 AdvBench+JailbreakBench
# unified suite. Superseded by LexBench Production
# (.github/workflows/lexbench-prod.yml): full sharded suite covering all
# benchmarks, grounded harm-compliance judge, auto-publishes to
# benchmark_results, targets the canonical www host (this file hits the bare
# apex — redirect/auth-stripping risk). Full original implementation
# (including the inline summary.md generator) remains available in git history
# at commit prior to this deprecation. Disabled below.
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      run_advbench:
        description: 'DEPRECATED — use "LexBench Production" instead.'
        default: 'true'

jobs:
  deprecated-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation notice
        run: |
          echo "::error::This workflow is deprecated and disabled. Use 'LexBench Production' (lexbench-prod.yml) instead — it covers AdvBench and JailbreakBench (plus HarmBench, TruthfulQA, AgentDojo) as part of the full, properly-sharded, grounded-judge suite."
          exit 1

  benchmark:
    if: false  # disabled — see deprecation notice above
    name: Run and Score
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - name: Run AdvBench
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx tsx scripts/advbench/run.ts --endpoint https://lexaureon.com --n 520 --out data/advbench-raw.jsonl
      - name: Run JailbreakBench
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx tsx scripts/jailbreakbench/run.ts --endpoint https://lexaureon.com --n 200 --out data/jbb-raw.jsonl
