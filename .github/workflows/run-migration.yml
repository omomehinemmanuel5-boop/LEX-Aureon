name: Run Migration Script

# Phone-friendly, tap-to-run migration executor. Emmanuel works entirely from
# mobile — no local shell to `npx tsx scripts/migrations/*.ts` from. This
# uses existing TURSO_DATABASE_URL / TURSO_AUTH_TOKEN GitHub secrets
# mapped from the Vercel Production application database (not the evaluation DB).
# on demand, from the GitHub mobile app or mobile browser: repo -> Actions ->
# "Run Migration Script" -> Run workflow -> (script path defaults to today's
# AdvBench retirement) -> Run workflow (green button).
#
# Deliberately NOT on any automatic trigger (no schedule, no push, no PR) —
# workflow_dispatch only, so a migration only ever runs when someone
# explicitly taps Run. Every migration script under scripts/migrations/ is
# expected to be self-checking (see 2026-07-08-retire-advbench-judge-
# exhaustion.ts for the pattern: verify the expected before-state, abort with
# a clear message and NO changes if it doesn't match).

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: 'Path to the migration script to run'
        required: true
        default: 'scripts/migrations/2026-07-08-retire-advbench-judge-exhaustion.ts'

env:
  NODE_VERSION: '20'

jobs:
  run-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Verify script exists
        env:
          MIGRATION_SCRIPT: ${{ inputs.script_path }}
        run: |
          if [[ ! "$MIGRATION_SCRIPT" =~ ^scripts/migrations/[A-Za-z0-9._-]+\.ts$ ]]; then
            echo "::error::Only TypeScript files directly inside scripts/migrations/ may be run."
            exit 1
          fi
          if [ ! -f "$MIGRATION_SCRIPT" ]; then
            echo "::error::Migration script not found."
            exit 1
          fi
          echo "Running: $MIGRATION_SCRIPT"

      - name: Verify application database credentials
        env:
          TURSO_APP_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_APP_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$TURSO_APP_DATABASE_URL" ] || [ -z "$TURSO_APP_AUTH_TOKEN" ]; then
            echo "::error::Missing TURSO_APP_DATABASE_URL or TURSO_APP_AUTH_TOKEN. Add both GitHub Actions secrets using the Vercel Production application database values."
            exit 1
          fi

      - name: Run migration script
        env:
          MIGRATION_SCRIPT: ${{ inputs.script_path }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx "$MIGRATION_SCRIPT"
