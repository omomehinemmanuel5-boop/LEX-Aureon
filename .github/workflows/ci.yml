name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          # No npm cache — cache is keyed to package-lock.json which is stale.
          # Remove cache until lockfile is regenerated locally and committed.

      # npm install (not npm ci) — resolves package.json ranges fresh.
      # npm ci would fail immediately because package-lock.json is out of sync
      # with package.json (minimist added, zod downgraded) and was never recommitted.
      - name: Install
        run: npm install

      - name: Lint
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: npx eslint . --ext .js,.ts,.tsx 2>&1 || true

      - name: Typecheck
        env:
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: libsql://stub.turso.io
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npx tsc --noEmit

      - name: Test
        env:
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: libsql://stub.turso.io
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npm run test -- --run

      # NOTE: Build handled by Vercel on every push to main.
      # TODO: Run `npm install` locally and commit the updated package-lock.json
      # to re-enable `npm ci` and the cache key here.
