name: LexBench Production

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Quick-test: prompts per benchmark (leave EMPTY for a full run)'
        required: false
        default: ''
  # schedule:
  #   - cron: '0 0 * * *'
  # DISABLED 2026-07-18 (Emmanuel) — daily automatic runs were burning free
  # provider quota (Gemini/Groq/Mistral/Jina) with no cost control. Manual
  # dispatch (workflow_dispatch above) still works for on-demand runs. Re-enable
  # this schedule block once quota is paid for.
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

# fix (2026-07-10) — CONCURRENCY GROUP WAS ON THE WRONG SCOPE, CANCELLING SHARDS:
# the 2026-07-08 fix below moved `concurrency:` onto the per-shard matrix job
# (run-lexbench), intending only to stop this workflow's runs from overlapping
# with lexbench-extended.yml's. Instead it broke THIS workflow's own run: every
# one of the ~18 matrix shard instances shared the identical static group name,
# and GitHub Actions concurrency groups only ever hold ONE running + ONE
# pending member — any THIRD (or later) member requesting the same group
# CANCELS whichever member was previously pending, not queues behind it. With
# max-parallel:2 launching shards continuously, this cancelled roughly every
# other shard as newer ones bumped older pending ones out. Confirmed against
# two consecutive real runs (a manual full dispatch and the following
# automatic midnight cron), both ending overall-cancelled with ~7 of 18 shards
# killed, publishing genuine-but-incomplete partial-sample results (e.g.
# AdvBench n=320 instead of 520) rather than the intended full run.
#
# Fix: concurrency now lives at the WORKFLOW level (here), not the job level.
# A top-level `concurrency:` block applies ONCE per whole workflow RUN, not
# once per matrix instance — so all ~18 shards within one run are governed
# ONLY by max-parallel on the matrix (unaffected by this bug), while the
# ENTIRE run, as a single unit, still shares one mutex with lexbench-
# extended.yml's entire run (and with any overlapping trigger of this same
# workflow — e.g. a manual dispatch overlapping the daily cron) via the same
# group name below.
concurrency:
  group: lexbench-live-api-provider-quota
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  # fix (2026-07-05) — ROOT CAUSE of every persistent "401 unauthorized" publish
  # failure this whole time: the apex domain lexaureon.com 307-redirects to the
  # canonical www.lexaureon.com. Node's native fetch() (used by
  # publish-results.ts) follows that redirect automatically — but per the
  # WHATWG fetch spec, it STRIPS the Authorization header on any cross-origin
  # redirect, for security. Every workflow call now targets the canonical www
  # host directly, so no redirect (and no header-stripping) happens at all.
  SITE_URL: https://www.lexaureon.com
  # fix (2026-07-07): this workflow's canonical 5 benchmarks — kept explicit
  # here (not "all") because BENCHMARK_CONFIGS in scripts/lexbench/runner.ts is
  # SHARED with lexbench-extended.yml, and now also contains xstest/
  # strong_reject. "--benchmark all" expands to Object.keys(BENCHMARK_CONFIGS)
  # — ALL 7 entries — regardless of which workflow calls it. This workflow
  # only ever fetches the HarmBench dataset (see below), so every shard used
  # to crash (ENOENT on data/xstest.jsonl) right after successfully finishing
  # these 5, which is why the workflow showed red while real data for these 5
  # still made it into benchmark_results (the crash happened AFTER they were
  # written to disk, and "Upload shard results" runs on if: always()).
  # lexbench-extended.yml already avoided this by looping over an explicit
  # list rather than relying on "all" — this applies that same proven pattern
  # here instead of touching the shared runner.ts.
  # fix (2026-07-17): agentdojo moved from LAST to FIRST. It ran last on both
  # 2026-07-16 and 2026-07-17 and had by far the worst coverage of any
  # benchmark both times (4/27, then 0/27) while earlier benchmarks in the
  # same sequence scored real (if degraded) verdicts. Since every benchmark
  # in this list runs sequentially within ONE shard process sharing ONE set
  # of provider keys, whichever benchmark runs last inherits the MOST
  # accumulated exhaustion from everything before it — a structural bias
  # independent of anything AgentDojo-specific. Also the smallest dataset
  # (27 prompts) of the five, so it clears fastest and has the best chance
  # of finishing before quota degrades, if it goes first instead of last.
  BENCHMARKS: agentdojo,truthfulqa,harmbench,jailbreakbench,advbench

jobs:
  # ── Fail FAST if BENCH_SECRET won't authorize a publish ─────────────────
  # Added 2026-07-05 after two separate multi-hour runs completed every shard
  # successfully and then discovered — only at the very last step — that
  # publishing was going to fail. Both times this cost hours of runtime and
  # provider quota before the actual problem was even visible. This job calls
  # the publish endpoint's GET auth-only precheck (same auth check as the real
  # POST, but never touches the database) in under a second, BEFORE any shard
  # runs.
  precheck-auth:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify BENCH_SECRET authorizes a publish
        run: |
          HTTP_CODE=$(curl -sS -L -o /tmp/precheck.json -w "%{http_code}" \
            ${{ env.SITE_URL }}/api/benchmarks/publish \
            -H "Authorization: Bearer ${{ secrets.BENCH_SECRET }}")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/precheck.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::BENCH_SECRET precheck FAILED (HTTP $HTTP_CODE). The GitHub Actions secret BENCH_SECRET does not authorize a publish to ${{ env.SITE_URL }}/api/benchmarks/publish right now. Update this repo's BENCH_SECRET (Settings → Secrets and variables → Actions) to match the value in Vercel exactly, then re-run. The full benchmark suite was intentionally NOT run, to avoid wasting hours and provider quota on a run that could never publish."
            exit 1
          fi
          echo "BENCH_SECRET precheck passed — proceeding with the full run."

  # ── Determine total prompts and shard count ─────────────────────────────
  determine-shards:
    needs: precheck-auth
    # Runs whenever precheck-auth succeeded OR was skipped (PR events) — only
    # blocked if precheck-auth actually ran and failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      shard-size: ${{ steps.set-matrix.outputs.shard-size }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      # HarmBench prompts are not committed (see .gitignore) — fetch the
      # official dataset so the prompt total includes HarmBench and the
      # shard count is correct. get-total-prompts.ts maintains its OWN
      # independent, hardcoded 5-benchmark list (not shared with runner.ts's
      # BENCHMARK_CONFIGS), so it was never affected by the xstest/
      # strong_reject addition — shard-count math has always stayed correct.
      - name: Fetch HarmBench dataset
        run: npx tsx scripts/harmbench/fetch-dataset.ts --out data/harmbench.jsonl

      # fix (2026-07-16): each shard previously re-fetched HarmBench independently
      # (~9 shards × one network fetch = same data downloaded 9 times). Upload it
      # once here and let shards download the artifact instead.
      - name: Cache HarmBench dataset for shards
        uses: actions/upload-artifact@v4
        with:
          name: harmbench-dataset-${{ github.run_id }}
          path: data/harmbench.jsonl
          retention-days: 1

      - name: Determine total prompts and shards
        id: set-matrix
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            # Quick-test mode (manual dispatch only): a single shard whose size is
            # the requested limit, so each benchmark runs just its first $LIMIT
            # prompts. Fast end-to-end validation of run → aggregate → publish.
            echo "Quick-test mode: ${LIMIT} prompts per benchmark, single shard."
            echo "matrix={\"shard-index\":[0]}" >> $GITHUB_OUTPUT
            echo "shard-size=${LIMIT}" >> $GITHUB_OUTPUT
          else
            TOTAL_PROMPTS=$(npx tsx scripts/lexbench/get-total-prompts.ts)
            echo "Total prompts: $TOTAL_PROMPTS"
            # fix (2026-07-14): 100 -> 200. Each shard pays fixed overhead
            # (checkout, npm install, re-fetching the HarmBench dataset)
            # before processing a single prompt. Halving the shard count
            # roughly halves the number of sequential batches, saving real
            # wall-clock time on setup that's paid once per shard regardless
            # of shard size — independent of max-parallel (see the
            # 2026-07-19 note below on the run-lexbench job for the current
            # concurrency value and why it changed).
            SHARD_SIZE=200
            NUM_SHARDS=$(( (TOTAL_PROMPTS + SHARD_SIZE - 1) / SHARD_SIZE ))
            # Guard against zero shards
            if [ "$NUM_SHARDS" -lt 1 ]; then NUM_SHARDS=1; fi
            INDICES=$(seq 0 $((NUM_SHARDS - 1)) | paste -sd, -)
            MATRIX_CONFIG="{\"shard-index\":[${INDICES}]}"
            echo "matrix=${MATRIX_CONFIG}" >> $GITHUB_OUTPUT
            echo "shard-size=${SHARD_SIZE}" >> $GITHUB_OUTPUT
          fi

  # ── Run each shard, bounded concurrency ─────────────────────────────────
  # fix (2026-07-08) — PROVIDER-QUOTA SATURATION: this job's matrix strategy
  # had no max-parallel, so GitHub Actions defaulted to running every shard
  # simultaneously (up to the account's job-concurrency ceiling) — e.g. a
  # ~1000-prompt run at shard-size=100 spins up ~10 shards at once, all
  # hitting the SAME shared GROQ_API_KEY/GEMINI_API_KEY/MISTRAL_API_KEY
  # secrets concurrently. That is the concurrent-load scenario
  # lib/sovereign_kernel.ts's 2026-07-08 header note describes: generateGoverned's
  # entire 5-provider fallback chain exhausting simultaneously under load,
  # producing governed_source='raw_fallback'/'unavailable' turns that
  # previously silently corrupted scored results (see AdvBench id=74
  # retirement, lib/benchmark_results.ts). max-parallel (bounded, see the
  # 2026-07-19 note directly below for the current value and why) caps this
  # workflow's own shard concurrency. (The cross-workflow mutex against
  # lexbench-extended.yml now lives at the top-level `concurrency:` block —
  # see the 2026-07-10 fix note there for why it was moved off this job.)
  #
  # fix (2026-07-18) — max-parallel 2 -> 3: verified the ~3-4hr wall clock is
  # NOT a fixable shard-imbalance bug (checked the actual math: shard 0
  # uniquely absorbs one full 200-prompt slice of every benchmark <=200
  # prompts, ~827 prompts, but shards 5-8 sit empty and GitHub Actions
  # backfills those slots almost instantly, so the OTHER lane ends up doing
  # ~937 prompts across its shards -- already close to a 50/50 split). The
  # wall clock is fundamentally total-prompt-count x per-prompt latency /
  # max-parallel, and the only real lever is max-parallel itself -- the same
  # lever that caused the original 2026-07-08 provider-exhaustion incident
  # this constant exists to prevent, so this was a deliberate, bounded
  # increase (+50%, not a doubling), not a reversal of that reasoning. The
  # 2026-07-17 sustained-exhaustion circuit breaker (runner.ts,
  # SUSTAINED_EXHAUSTION_THRESHOLD) changed the risk calculus: if concurrent
  # shards DO saturate shared provider quota, a shard now fails fast (minutes)
  # rather than silently grinding through hundreds of doomed retries for
  # hours, so the downside of a further increase is now bounded in a way it
  # wasn't when max-parallel:2 was first chosen.
  #
  # fix (2026-07-19) — max-parallel 3 -> 4: raised further now that the
  # underlying cause of provider exhaustion is meaningfully mitigated, not
  # just bounded by the circuit breaker: (a) lib/provider_cooldown.ts makes
  # cooldown discovery SHARED across concurrent instances (a 429 found by
  # one shard's requests is now visible to every other shard within ~20s,
  # instead of each one re-discovering it independently — see that file's
  # header), and (b) lib/llm_provider.ts's generateGoverned and
  # lib/lex_memory.ts's embedding provider selection now DISTRIBUTE across
  # Gemini/Cerebras/Groq and Gemini/Jina by default instead of concentrating
  # every call on Gemini first (see both files' 2026-07-19 fix notes).
  # Together these reduce both how much load concentrates on any single
  # provider AND how much wasted retry latency accumulates once one does
  # exhaust — the two things max-parallel was originally chosen to bound.
  # Matches lexbench-extended.yml's same-day increase to the same value.
  run-lexbench:
    needs: determine-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.determine-shards.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      # fix (2026-07-16): use the cached dataset from determine-shards instead
      # of re-fetching from the network on every shard (was ~9 identical fetches).
      - name: Download HarmBench dataset
        uses: actions/download-artifact@v4
        with:
          name: harmbench-dataset-${{ github.run_id }}
          path: data/

      # fix (2026-07-07): loop over the explicit BENCHMARKS list (env, top of
      # file) instead of `--benchmark all` — see the env block comment for why.
      - name: Run LexBench Shard ${{ matrix.shard-index }}
        run: |
          for benchmark in $(echo "${{ env.BENCHMARKS }}" | tr ',' ' '); do
            echo ""
            echo "[*] Starting $benchmark..."
            npx tsx scripts/lexbench/runner.ts \
              --benchmark "$benchmark" \
              --endpoint ${{ env.SITE_URL }} \
              --shard-index ${{ matrix.shard-index }} \
              --shard-size ${{ needs.determine-shards.outputs.shard-size }}
          done
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
          TURSO_DATABASE_URL:   ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:     ${{ secrets.TURSO_AUTH_TOKEN }}
          ADMIN_PASSWORD:       ${{ secrets.ADMIN_PASSWORD }}
          JINA_API_KEY:         ${{ secrets.JINA_API_KEY }}
          CRON_SECRET:          ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexbench-shard-results-${{ matrix.shard-index }}
          path: data/lexbench-*.jsonl
          # A shard that crashed before saving any benchmark's results (e.g. a
          # dataset-fetch flake) would otherwise make this upload step fail on
          # "no files found", which — combined with the fix below — should still
          # not block aggregation of every OTHER shard's real output.
          if-no-files-found: ignore

  # ── Aggregate all shards, report, and publish to the live leaderboard ──
  aggregate-and-report:
    needs: run-lexbench
    # fix (2026-07): this job previously had a bare `needs: run-lexbench`, which
    # defaults to requiring run-lexbench to have SUCCEEDED overall. With
    # fail-fast:false and a multi-shard matrix, if even ONE shard fails, the
    # overall run-lexbench job's conclusion is "failure" — and a downstream job
    # with no `if:` guard is SKIPPED entirely, even though every other shard
    # succeeded. `!cancelled()` runs this job whenever the matrix finished
    # (success OR partial failure), so a single bad shard can no longer
    # silently block publishing everything that DID succeed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      # Fix: use pattern + merge-multiple to collect all shard artifacts
      # fix (2026-07-17): removed if-no-files-found — that input exists on
      # actions/upload-artifact, NOT actions/download-artifact. Harmless
      # (GitHub Actions warns and ignores an unrecognized input rather than
      # failing), but it was noise on every run's Annotations panel,
      # surfaced while diagnosing the 2026-07-17 publish failure.
      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: lexbench-shard-results-*
          merge-multiple: true
          path: results/

      - name: Aggregate results and generate report
        run: |
          find results/ -name "lexbench-*.jsonl" -print0 | xargs -0 cat > all_results.jsonl 2>/dev/null || true
          LINES=$(wc -l < all_results.jsonl 2>/dev/null || echo 0)
          echo "Total result rows: $LINES"
          if [ "$LINES" -eq 0 ]; then
            echo "::warning::No shard results found — every shard may have failed. Skipping aggregate/publish."
            exit 0
          fi
          npx tsx scripts/lexbench/aggregate-report.ts all_results.jsonl > summary.json
          echo "Summary:"
          cat summary.json

      - name: Run regression check
        continue-on-error: true
        run: |
          if [ -f summary.json ] && [ -f data/lexbench-summary.json ]; then
            npx tsx scripts/lexbench/check-regression.ts summary.json data/lexbench-summary.json
          else
            echo "No summary or baseline found — skipping regression check"
          fi

      # This is the step that publishes to the live table the public site reads.
      # It POSTs summary.json to the canonical writer /api/benchmarks/publish,
      # authenticated with BENCH_SECRET.
      #
      # fix (2026-07-09) — QUICK-TEST RUNS WERE PUBLISHING TO THE LIVE SITE:
      # this condition previously only checked event_name, which is
      # 'workflow_dispatch' for BOTH a real full run AND a quick-test run
      # (limit set) — there was nothing distinguishing them. A 10-prompt
      # quick-test dispatched to validate today's fixes ended up publishing
      # n=10 noise rows that became the new MAX(id) for five benchmarks,
      # silently overwriting real historical results (including the AdvBench
      # id=62 baseline this same session had just spent time restoring).
      # The "Commit summary to repo" step below already had the correct
      # `github.event.inputs.limit == ''` guard — this now matches it. A
      # schedule-triggered run has no `inputs` object at all, so
      # `github.event.inputs.limit` evaluates to empty there too, correctly
      # allowing scheduled runs to publish.
      - name: Publish results to live leaderboard
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.inputs.limit == ''
        run: |
          if [ ! -f summary.json ]; then
            echo "::warning::No summary.json (no shard produced results) — nothing to publish."
            exit 0
          fi
          npx tsx scripts/lexbench/publish-results.ts summary.json
        env:
          BENCH_SECRET:         ${{ secrets.BENCH_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexbench-final-report-${{ github.run_id }}
          path: summary.json
          if-no-files-found: ignore

      # fix (2026-07-19) — `git add` WAS SILENTLY FAILING: data/ is listed in
      # .gitignore, so `git add data/lexbench-summary.json` errored ("The
      # following paths are ignored by one of your .gitignore files") and
      # the step exited nonzero — confirmed directly in lexbench-extended.yml's
      # identical step's real run log the same day, then checked here and
      # found the same bug. This means the committed baseline
      # (data/lexbench-summary.json), which check-regression.ts above reads
      # to compare a new run against, was likely never actually updated by
      # this path since it was introduced. `git add -f` overrides the ignore
      # rule for this one intentionally-tracked exception.
      - name: Commit summary to repo
        # Don't overwrite the committed baseline with a tiny quick-test summary,
        # and don't commit if nothing was produced this run.
        if: github.event.inputs.limit == ''
        continue-on-error: true
        run: |
          if [ ! -f summary.json ]; then
            echo "No summary.json — nothing to commit."
            exit 0
          fi
          git config user.name  "Lex CRS Agent"
          git config user.email "lexaureon@gmail.com"
          cp summary.json data/lexbench-summary.json
          git add -f data/lexbench-summary.json
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "results: LexBench production run $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
