name: AgentDojo Three-Arm Evaluation

on:
  pull_request:
    paths:
      - 'scripts/agentdojo-real/**'
      - 'lib/agents/**'
      - 'data/agentdojo.jsonl'
      - '.github/workflows/agentdojo-three-arm.yml'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  three-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/agentdojo-real/trajectory-run.ts
