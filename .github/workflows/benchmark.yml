name: Benchmark Suite

# Unified benchmark: AdvBench (Zou et al. 2023) + JailbreakBench (NeurIPS 2024)
# Runs against the live lexaureon.com endpoint with full kernel capture.
#
# Required repository secret:
#   GROQ_API_KEY  - for LLM judge (llama-3.1-8b via Groq)
#
# Trigger: Actions tab -> "Benchmark Suite" -> Run workflow
#
# Artifacts (90-day retention):
#   advbench-raw.jsonl          full kernel capture per prompt
#   advbench-scored.jsonl       + bare_verdict + governed_verdict
#   jailbreakbench-raw.jsonl    full kernel capture (harmful + benign)
#   jailbreakbench-scored.jsonl + verdicts + over-refusal
#   summary.md                  results table + telemetry

on:
  workflow_dispatch:
    inputs:
      run_advbench:
        description: 'Run AdvBench (520 harmful behaviors, Zou et al. 2023)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_jbb:
        description: 'Run JailbreakBench (100 harmful + 100 benign, NeurIPS 2024)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      n_advbench:
        description: 'AdvBench prompt count (max 520)'
        required: false
        default: '520'
      n_jbb:
        description: 'JBB prompt count (max 200)'
        required: false
        default: '200'
      llm_judge:
        description: 'Score with LLM judge (requires GROQ_API_KEY secret set)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      endpoint:
        description: 'Governance endpoint'
        required: false
        default: 'https://lexaureon.com'

jobs:
  benchmark:
    name: Run and Score
    runs-on: ubuntu-latest
    # AdvBench 520 x 5s delay ~45 min + JBB 200 x 5s ~17 min + scoring ~15 min = ~80 min
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Record run metadata
        run: |
          echo "RUN_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "RUN_DATE_SHORT=$(date -u +%Y%m%d)" >> $GITHUB_ENV
          echo "COMMIT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      # ── AdvBench ──────────────────────────────────────────────
      - name: Run AdvBench
        if: github.event.inputs.run_advbench != 'false'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx tsx scripts/advbench/run.ts \
            --endpoint "${{ github.event.inputs.endpoint || 'https://lexaureon.com' }}" \
            --n "${{ github.event.inputs.n_advbench || '520' }}" \
            --out data/advbench-raw.jsonl

      - name: Score AdvBench
        if: github.event.inputs.run_advbench != 'false'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          JUDGE_FLAG=""
          if [ "${{ github.event.inputs.llm_judge }}" = "true" ] && [ -n "$GROQ_API_KEY" ]; then
            JUDGE_FLAG="--llm-judge"
            echo "Using LLM judge"
          else
            echo "Using heuristic judge (set GROQ_API_KEY secret to enable LLM judge)"
          fi
          npx tsx scripts/advbench/score.ts \
            --in  data/advbench-raw.jsonl \
            --out data/advbench-scored.jsonl \
            $JUDGE_FLAG

      # ── JailbreakBench ────────────────────────────────────────
      - name: Run JailbreakBench
        if: github.event.inputs.run_jbb != 'false'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx tsx scripts/jailbreakbench/run.ts \
            --endpoint "${{ github.event.inputs.endpoint || 'https://lexaureon.com' }}" \
            --n "${{ github.event.inputs.n_jbb || '200' }}" \
            --out data/jbb-raw.jsonl

      - name: Score JailbreakBench
        if: github.event.inputs.run_jbb != 'false'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          JUDGE_FLAG=""
          if [ "${{ github.event.inputs.llm_judge }}" = "true" ] && [ -n "$GROQ_API_KEY" ]; then
            JUDGE_FLAG="--llm-judge"
          fi
          npx tsx scripts/jailbreakbench/score.ts \
            --in  data/jbb-raw.jsonl \
            --out data/jbb-scored.jsonl \
            $JUDGE_FLAG

      # ── Summary ───────────────────────────────────────────────
      - name: Generate summary
        if: always()
        run: |
          node -e "
          const fs = require('fs');

          function readJSONL(path) {
            if (!fs.existsSync(path)) return [];
            return fs.readFileSync(path, 'utf8').split('\n').filter(Boolean).map(l => {
              try { return JSON.parse(l); } catch { return null; }
            }).filter(Boolean);
          }

          function asr(rows, arm) {
            const valid = rows.filter(r => !r.error);
            const hits  = valid.filter(r => r[arm] === 'FULFILL').length;
            if (!valid.length) return 'N/A';
            return hits + '/' + valid.length + ' = ' + (hits / valid.length * 100).toFixed(1) + '%';
          }

          function telemetry(rows) {
            const v = rows.filter(r => !r.error && r.M > 0);
            if (!v.length) return 'no data';
            const avgM = (v.reduce((s, r) => s + r.M, 0) / v.length).toFixed(3);
            const minM = Math.min(...v.map(r => r.M)).toFixed(3);
            const intv = v.filter(r => r.intervention && r.intervention.triggered).length;
            const cbf  = v.filter(r => r.projection_triggered).length;
            const atk  = v.filter(r => r.semantic_signal && r.semantic_signal.attack_type && r.semantic_signal.attack_type !== 'none').length;
            return 'avgM=' + avgM + ' minM=' + minM + ' interventions=' + intv + ' cbf_fires=' + cbf + ' attacks_detected=' + atk;
          }

          const adv  = readJSONL('data/advbench-scored.jsonl');
          const jbb  = readJSONL('data/jbb-scored.jsonl');
          const jbbH = jbb.filter(r => r.type === 'harmful');
          const jbbB = jbb.filter(r => r.type === 'benign');
          const advR = readJSONL('data/advbench-raw.jsonl');
          const jbbR = readJSONL('data/jbb-raw.jsonl');

          const judge = process.env.LLM_JUDGE === 'true' ? 'LLM judge: llama-3.1-8b via Groq' : 'Heuristic judge: neutral refusal markers';

          const lines = [
            '# Lex Aureon Benchmark Results',
            '',
            '**Date:** ' + process.env.RUN_DATE,
            '**Commit:** ' + process.env.COMMIT_SHA,
            '**Endpoint:** ' + process.env.ENDPOINT,
            '**Judge:** ' + judge,
            '**Run ID:** ' + process.env.GITHUB_RUN_ID,
            '',
            '---',
            '',
            '## Scoring methodology',
            '',
            'Same judge on both arms. Framework vocabulary excluded from refusal detection.',
            'ASR computed over harmful prompts only. Over-refusal on benign prompts reported separately.',
            '',
            '---',
            '',
            '## AdvBench (Zou et al. 2023)',
            '',
            '520 harmful behaviors from harmful_behaviors.csv (real dataset)',
            '',
          ];

          if (adv.length) {
            lines.push('| Arm | ASR |');
            lines.push('|---|---|');
            lines.push('| Bare (ungoverned) | ' + asr(adv, 'bare_verdict') + ' |');
            lines.push('| Governed (SovereignKernel) | ' + asr(adv, 'governed_verdict') + ' |');
            lines.push('');
            lines.push('Kernel telemetry: ' + telemetry(advR));
          } else { lines.push('Not run.'); }

          lines.push('', '---', '', '## JailbreakBench (NeurIPS 2024)', '', '100 harmful + 100 benign behaviors', '');

          if (jbb.length) {
            lines.push('| Arm | Harmful ASR | Over-refusal (benign) |');
            lines.push('|---|---|---|');
            const bH = jbbH.filter(r => r.bare_verdict === 'FULFILL').length;
            const gH = jbbH.filter(r => r.governed_verdict === 'FULFILL').length;
            const bB = jbbB.filter(r => r.bare_verdict !== 'FULFILL').length;
            const gB = jbbB.filter(r => r.governed_verdict !== 'FULFILL').length;
            lines.push('| Bare | ' + bH + '/' + jbbH.length + ' | ' + bB + '/' + jbbB.length + ' |');
            lines.push('| Governed | ' + gH + '/' + jbbH.length + ' | ' + gB + '/' + jbbB.length + ' |');
            lines.push('');
            lines.push('Kernel telemetry: ' + telemetry(jbbR));
          } else { lines.push('Not run.'); }

          fs.writeFileSync('data/summary.md', lines.join('\n'));
          console.log(lines.join('\n'));
          "
        env:
          RUN_DATE: ${{ env.RUN_DATE }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
          ENDPOINT: ${{ github.event.inputs.endpoint || 'https://lexaureon.com' }}
          LLM_JUDGE: ${{ github.event.inputs.llm_judge || 'true' }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      # ── Upload artifacts ──────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ github.run_id }}-${{ env.RUN_DATE_SHORT }}
          retention-days: 90
          path: |
            data/advbench-raw.jsonl
            data/advbench-scored.jsonl
            data/jbb-raw.jsonl
            data/jbb-scored.jsonl
            data/summary.md
