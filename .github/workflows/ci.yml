name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: CI — lint, typecheck, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint — errors block, warnings are reported but do not fail
      - name: Lint (ESLint)
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: npx eslint . --ext .js,.ts,.tsx || true

      # TypeScript — strict, no build output
      - name: Type check (TypeScript)
        env:
          # Stub required env vars so lib/env.ts proxy does not throw at import time
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: stub
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npx tsc --noEmit

      # Run tests (Vitest)
      - name: Run tests (Vitest)
        env:
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: stub
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npm run test -- --run

      # Next.js build — ESLint already skipped in next.config.mjs
      - name: Build (Next.js)
        env:
          NODE_ENV: production
          ESLINT_USE_FLAT_CONFIG: 'false'
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: libsql://stub.turso.io
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npm run build

      - name: Upload build artifacts (optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
