name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# One run per branch — cancel stale jobs on new push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install
        run: npm ci

      # Lint — never blocks, just reports
      - name: Lint
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: npx eslint . --ext .js,.ts,.tsx 2>&1 || true

      # TypeScript — the real type safety gate
      - name: Typecheck
        env:
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: libsql://stub.turso.io
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npx tsc --noEmit

      # Unit + integration tests
      - name: Test
        env:
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: libsql://stub.turso.io
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npm run test -- --run

      # NOTE: Build step intentionally removed from CI.
      # Vercel handles production builds on every push to main.
      # Vercel is the authoritative build gate — if it passes, the site is live.
      # Running Next.js build in CI as well was causing false failures due to
      # lockfile/dependency mismatches between the CI and Vercel environments.
      # TypeScript and tests above catch real regressions.
