name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Cancel any in-progress run for the same branch when a new commit arrives.
# This eliminates duplicate runs and stale queued jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: CI — typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint — reports issues but never blocks the run.
      - name: Lint (report only)
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: npx eslint . --ext .js,.ts,.tsx 2>&1 || true

      # TypeScript strict check — no build output.
      # Stub env vars so lib/env.ts Proxy never throws at import time.
      - name: Type check
        env:
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: libsql://stub.turso.io
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npx tsc --noEmit

      # Unit + integration tests.
      # env.test.ts is stubbed (describe.skip) — was importing a non-existent path.
      # All other tests are meaningful and must pass.
      - name: Run tests
        env:
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: libsql://stub.turso.io
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npm run test -- --run

      # Next.js production build.
      - name: Build
        env:
          NODE_ENV: production
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: libsql://stub.turso.io
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npm run build
