name: AgentDojo Three-Arm Evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  three-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/agentdojo-real/trajectory-run.ts
