name: Auto Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on new push to same ref — matches ci.yml behaviour
concurrency:
  group: auto-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No cache — package-lock.json is out of sync with package.json.
          # Re-enable cache once lockfile is regenerated locally and committed.
      # npm install (not npm ci) — resolves ranges fresh without requiring
      # a perfectly-synced lockfile. npm ci would fail immediately here.
      - run: npm install
      - run: npm run build
        env:
          GROQ_API_KEY: placeholder
          JINA_API_KEY: placeholder
          TURSO_DATABASE_URL: libsql://placeholder.turso.io
          TURSO_AUTH_TOKEN: placeholder
          ADMIN_PASSWORD: placeholder
          CRON_SECRET: placeholder
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No cache — same reason as above
      - run: npm install
      - run: npm run test -- --run
        env:
          GROQ_API_KEY: placeholder
          JINA_API_KEY: placeholder
          TURSO_DATABASE_URL: libsql://placeholder.turso.io
          TURSO_AUTH_TOKEN: placeholder
          ADMIN_PASSWORD: placeholder
          CRON_SECRET: placeholder
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan git history for real Groq keys
        run: |
          if git log --all -p | grep -qE "gsk_[a-zA-Z0-9]{40,}"; then
            echo "REAL GROQ KEY FOUND IN GIT HISTORY — rotate immediately"
            exit 1
          fi
          echo "Secret scan passed"
