name: "[DEPRECATED] Jailbreak Robustness"

# ══════════════════════════════════════════════════════════════════════════
# DEPRECATED (2026-07-06) — DO NOT RUN, but the CONCEPT here is worth keeping
# on the roadmap: wrapping harmful behaviors in documented jailbreak templates
# so the bare arm is actually exploitable (plain-behavior benchmarks often
# show 0% on both arms since an aligned base model refuses anyway, which is
# uninformative about what governance specifically adds). Not yet ported into
# LexBench Production — worth doing properly as a real enhancement rather than
# left running as an unintegrated, non-publishing side workflow. Disabled
# below so it cannot accidentally run and consume shared quota.
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      n_harmful:
        description: 'DEPRECATED — concept not yet ported into LexBench Production.'
        default: '50'

jobs:
  deprecated-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation notice
        run: |
          echo "::error::This workflow is deprecated and disabled. Its jailbreak-template-wrapping concept is worth porting into 'LexBench Production' (lexbench-prod.yml) as a proper enhancement, but is not yet integrated there — do not run this standalone version."
          exit 1

  jailbreak:
    if: false  # disabled — see deprecation notice above
    name: Run and Score
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - name: Run jailbreak attacks (bare vs governed)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx tsx scripts/jailbreak/run.ts \
            --n 50 --benign 50 --attacks all \
            --endpoint https://lexaureon.com \
            --temperature "0" --seed "42" \
            --out data/jailbreak-raw.jsonl
