name: Lex Custom Agent-Governance Three-Arm Smoke

on:
  pull_request:
    paths:
      - 'scripts/agentdojo-real/**'
      - 'lib/agents/**'
      - 'data/agentdojo.jsonl'
      - '.github/workflows/agentdojo-three-arm.yml'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  three-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run custom three-arm evaluation
        run: npx tsx scripts/agentdojo-real/trajectory-run.ts --json data/eval/agentdojo-three-arm.json
      - uses: actions/upload-artifact@v4
        with:
          name: lex-custom-agent-governance-three-arm
          path: data/eval/agentdojo-three-arm.json
          if-no-files-found: error
          retention-days: 14
