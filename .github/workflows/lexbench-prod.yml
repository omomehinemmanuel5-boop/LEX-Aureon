name: LexBench Production

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Quick-test: prompts per benchmark (leave EMPTY for a full run)'
        required: false
        default: ''
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

env:
  NODE_VERSION: '20'

jobs:
  # ── Fail FAST if BENCH_SECRET won't authorize a publish ─────────────────
  # Added 2026-07-05 after two separate multi-hour runs completed every shard
  # successfully and then discovered — only at the very last step — that
  # publishing was going to fail (wrong endpoint/auth, then a secret mismatch).
  # Both times this cost hours of runtime and provider quota before the actual
  # problem was even visible. This job calls the publish endpoint's GET
  # auth-only precheck (app/api/benchmarks/publish/route.ts — same auth check
  # as the real POST, but never touches the database) in under a second, BEFORE
  # any shard runs. A bad secret now fails in ~10s with an unambiguous
  # ::error:: annotation instead of silently wasting an entire run.
  #
  # Only gates schedule/workflow_dispatch — PR runs never publish (see the
  # publish step's own condition below) so there's nothing to precheck for
  # them; the job is skipped, and `needs: precheck-auth` proceeds normally for
  # a SKIPPED dependency (GitHub Actions only blocks on FAILED/CANCELLED).
  precheck-auth:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify BENCH_SECRET authorizes a publish
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/precheck.json -w "%{http_code}" \
            https://lexaureon.com/api/benchmarks/publish \
            -H "Authorization: Bearer ${{ secrets.BENCH_SECRET }}")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/precheck.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::BENCH_SECRET precheck FAILED (HTTP $HTTP_CODE). The GitHub Actions secret BENCH_SECRET does not authorize a publish to https://lexaureon.com/api/benchmarks/publish right now. Update this repo's BENCH_SECRET (Settings → Secrets and variables → Actions) to match the value in Vercel exactly, then re-run. The full benchmark suite was intentionally NOT run, to avoid wasting hours and provider quota on a run that could never publish."
            exit 1
          fi
          echo "BENCH_SECRET precheck passed — proceeding with the full run."

  # ── Determine total prompts and shard count ─────────────────────────────
  determine-shards:
    needs: precheck-auth
    # Runs whenever precheck-auth succeeded OR was skipped (PR events) — only
    # blocked if precheck-auth actually ran and failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      shard-size: ${{ steps.set-matrix.outputs.shard-size }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      # HarmBench prompts are not committed (see .gitignore) — fetch the
      # official dataset so the prompt total includes HarmBench and the
      # shard count is correct.
      - name: Fetch HarmBench dataset
        run: npx tsx scripts/harmbench/fetch-dataset.ts --out data/harmbench.jsonl

      - name: Determine total prompts and shards
        id: set-matrix
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            # Quick-test mode (manual dispatch only): a single shard whose size is
            # the requested limit, so each benchmark runs just its first $LIMIT
            # prompts. Fast end-to-end validation of run → aggregate → publish.
            echo "Quick-test mode: ${LIMIT} prompts per benchmark, single shard."
            echo "matrix={\"shard-index\":[0]}" >> $GITHUB_OUTPUT
            echo "shard-size=${LIMIT}" >> $GITHUB_OUTPUT
          else
            TOTAL_PROMPTS=$(npx tsx scripts/lexbench/get-total-prompts.ts)
            echo "Total prompts: $TOTAL_PROMPTS"
            SHARD_SIZE=100
            NUM_SHARDS=$(( (TOTAL_PROMPTS + SHARD_SIZE - 1) / SHARD_SIZE ))
            # Guard against zero shards
            if [ "$NUM_SHARDS" -lt 1 ]; then NUM_SHARDS=1; fi
            INDICES=$(seq 0 $((NUM_SHARDS - 1)) | paste -sd, -)
            MATRIX_CONFIG="{\"shard-index\":[${INDICES}]}"
            echo "matrix=${MATRIX_CONFIG}" >> $GITHUB_OUTPUT
            echo "shard-size=${SHARD_SIZE}" >> $GITHUB_OUTPUT
          fi

  # ── Run each shard in parallel ──────────────────────────────────────────
  run-lexbench:
    needs: determine-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine-shards.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      # Each shard runs in a fresh checkout, so re-fetch the un-committed
      # HarmBench dataset here too.
      - name: Fetch HarmBench dataset
        run: npx tsx scripts/harmbench/fetch-dataset.ts --out data/harmbench.jsonl

      - name: Run LexBench Shard ${{ matrix.shard-index }}
        run: |
          npx tsx scripts/lexbench/runner.ts \
            --benchmark all \
            --endpoint https://lexaureon.com \
            --shard-index ${{ matrix.shard-index }} \
            --shard-size ${{ needs.determine-shards.outputs.shard-size }}
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
          TURSO_DATABASE_URL:   ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:     ${{ secrets.TURSO_AUTH_TOKEN }}
          ADMIN_PASSWORD:       ${{ secrets.ADMIN_PASSWORD }}
          JINA_API_KEY:         ${{ secrets.JINA_API_KEY }}
          CRON_SECRET:          ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexbench-shard-results-${{ matrix.shard-index }}
          path: data/lexbench-*.jsonl
          # A shard that crashed before saving any benchmark's results (e.g. a
          # dataset-fetch flake) would otherwise make this upload step fail on
          # "no files found", which — combined with the fix below — should still
          # not block aggregation of every OTHER shard's real output.
          if-no-files-found: ignore

  # ── Aggregate all shards, report, and publish to the live leaderboard ──
  aggregate-and-report:
    needs: run-lexbench
    # fix (2026-07): this job previously had a bare `needs: run-lexbench`, which
    # defaults to requiring run-lexbench to have SUCCEEDED overall. With
    # fail-fast:false and a multi-shard matrix, if even ONE shard fails, the
    # overall run-lexbench job's conclusion is "failure" — and a downstream job
    # with no `if:` guard is SKIPPED entirely, even though every other shard
    # succeeded. This is exactly what happened on 2026-07-04: every shard that
    # ran finished cleanly (confirmed via praxis_receipts), but nothing was ever
    # published because aggregate-and-report never ran at all. `!cancelled()`
    # runs this job whenever the matrix finished (success OR partial failure),
    # so a single bad shard can no longer silently block publishing everything
    # that DID succeed. (Deliberately not `always()`, which would also fire
    # after an explicit manual cancellation.)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      # Fix: use pattern + merge-multiple to collect all shard artifacts
      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: lexbench-shard-results-*
          merge-multiple: true
          path: results/
          if-no-files-found: warn

      - name: Aggregate results and generate report
        run: |
          find results/ -name "lexbench-*.jsonl" -print0 | xargs -0 cat > all_results.jsonl 2>/dev/null || true
          LINES=$(wc -l < all_results.jsonl 2>/dev/null || echo 0)
          echo "Total result rows: $LINES"
          if [ "$LINES" -eq 0 ]; then
            echo "::warning::No shard results found — every shard may have failed. Skipping aggregate/publish."
            exit 0
          fi
          npx tsx scripts/lexbench/aggregate-report.ts all_results.jsonl > summary.json
          echo "Summary:"
          cat summary.json

      - name: Run regression check
        continue-on-error: true
        run: |
          if [ -f summary.json ] && [ -f data/lexbench-summary.json ]; then
            npx tsx scripts/lexbench/check-regression.ts summary.json data/lexbench-summary.json
          else
            echo "No summary or baseline found — skipping regression check"
          fi

      # This is the step that publishes to the live table the public site reads.
      # It POSTs summary.json to the canonical writer /api/benchmarks/publish,
      # authenticated with BENCH_SECRET (the ONLY accepted auth for that route).
      # By the time this step runs, precheck-auth has already confirmed
      # BENCH_SECRET authorizes successfully — so a 401 here would mean the
      # secret changed mid-run, which is not expected but is still handled
      # (this step's own failure won't silently vanish; see the exit code).
      # Publishes on scheduled AND manual (workflow_dispatch) runs — including
      # quick-test runs, so a small-N row appears to confirm the path end-to-end;
      # a later full run overwrites what the site shows (reader takes MAX(id)).
      # PR runs never publish (smoke tests on unmerged code).
      - name: Publish results to live leaderboard
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          if [ ! -f summary.json ]; then
            echo "::warning::No summary.json (no shard produced results) — nothing to publish."
            exit 0
          fi
          npx tsx scripts/lexbench/publish-results.ts summary.json
        env:
          BENCH_SECRET:         ${{ secrets.BENCH_SECRET }}
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexbench-final-report-${{ github.run_id }}
          path: summary.json
          if-no-files-found: ignore

      - name: Commit summary to repo
        # Don't overwrite the committed baseline with a tiny quick-test summary,
        # and don't commit if nothing was produced this run.
        if: github.event.inputs.limit == ''
        continue-on-error: true
        run: |
          if [ ! -f summary.json ]; then
            echo "No summary.json — nothing to commit."
            exit 0
          fi
          git config user.name  "Lex CRS Agent"
          git config user.email "lexaureon@gmail.com"
          cp summary.json data/lexbench-summary.json
          git add data/lexbench-summary.json
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "results: LexBench production run $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
