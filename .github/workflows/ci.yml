name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Cancel any in-progress run for the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: CI — typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # Use npm install (not npm ci) so package.json version ranges are resolved
      # fresh. This ensures pinned versions (e.g. zod ^3.24.0) take effect
      # without requiring a lockfile commit from a local machine.
      - name: Install dependencies
        run: npm install --prefer-offline

      # Lint — reports issues but never blocks CI.
      - name: Lint (report only)
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: npx eslint . --ext .js,.ts,.tsx 2>&1 || true

      # TypeScript strict check — no build output.
      # scripts/ excluded in tsconfig.json (they run via tsx, not tsc).
      - name: Type check
        env:
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: libsql://stub.turso.io
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npx tsc --noEmit

      # Unit + integration tests.
      # env.test.ts is stubbed (describe.skip).
      # lex_memory and rate_limit are mocked in api.integration.test.ts.
      - name: Run tests
        env:
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: libsql://stub.turso.io
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npm run test -- --run

      # Next.js production build.
      # TypeScript errors caught above — ignoreBuildErrors: true in next.config.mjs.
      - name: Build
        env:
          NODE_ENV: production
          GROQ_API_KEY: stub
          JINA_API_KEY: stub
          TURSO_DATABASE_URL: libsql://stub.turso.io
          TURSO_AUTH_TOKEN: stub
          ADMIN_PASSWORD: stub
          CRON_SECRET: stub
          NEXT_PUBLIC_SITE_URL: https://lexaureon.com
        run: npm run build
